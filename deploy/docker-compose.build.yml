# Overlay that builds the images from a source checkout instead of pulling them:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  api:
    build:
      context: ..
      dockerfile: src/backend/Dockerfile
    image: aimsby-api:local

  web:
    build:
      context: ../src/frontend/Aimsby.Web
      dockerfile: Dockerfile
    image: aimsby-web:local

  whisper:
    build: ./speech/whisper
    image: aimsby-whisper:local

  updater:
    build: ./updater
    image: aimsby-updater:local
    environment:
      SELF_IMAGE: aimsby-updater:local
